
name: SFCTL-test

on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * * # daily
jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall -e ./src
        pip install --force-reinstall -r requirements.txt
    - name: Pre Test configuration
      run: |
        python scripts/check_and_use_custom_sdk.py
        sfctl settings telemetry set-telemetry --off
    - name: test
      run: |
        scripts/verify.sh local

  build_wheel:
    name: build wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get versions
      run: |
        echo "pip version:"
        pip -V
        echo "python version:"
        python -V
        echo "git version:"
        git --version
        echo "bash version:"
        bash --version
        echo "os version:"
        cat /proc/version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall -e ./src
        pip install --force-reinstall -r requirements.txt

    - name: install wheel
      run: |
        pip install wheel==0.37.1

    - name: Build Wheel
      run: | 
        cd src
        python setup.py bdist_wheel --universal

    - name: upload wheel
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: wheel
        path:  /home/runner/work/service-fabric-cli/service-fabric-cli/src/dist*
