
name: SFCTL-test

on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * * # daily
jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall -e ./src
        pip install --force-reinstall -r requirements.txt
    - name: Pre Test configuration
      run: |
        python scripts/check_and_use_custom_sdk.py
        sfctl settings telemetry set-telemetry --off
    - name: test
      run: |
        scripts/verify.sh local

  build_wheel:
    name: build wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get versions
      run: |
        echo "pip version:"
        pip -V
        echo "python version:"
        python -V
        echo "git version:"
        git --version
        echo "bash version:"
        bash --version
        echo "os version:"
        cat /proc/version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall -e ./src
        pip install --force-reinstall -r requirements.txt

    - name: install wheel
      run: |
        pip install wheel==0.37.1

    - name: Build Wheel
      run: | 
        cd src
        python setup.py bdist_wheel --universal

    - name: upload wheel
      uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2.3.1
      if: always()
      with:
        name: wheel
        path:  /home/runner/work/service-fabric-cli/service-fabric-cli/src/dist*
